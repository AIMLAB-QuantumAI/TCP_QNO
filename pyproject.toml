[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtro"
version = "1.0.0"
description = "Quantum transport-reset operator (QTRO) for distributional prediction of TCP/AQM dynamics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["torch>=2.4", "numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["qtro*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]
