# The shorter recipe used by the circuit-depth screen: horizons 1 and 5,
# otherwise identical to ns3_h20.yaml.
grid:
  n_w: 16
  n_q: 16
  n_phase: 2
  w_min: 1.0
  w_max: 64.0
  buffer_pkts: 90.0
  q_crit_frac: 0.8
  beta: 0.5
  q_cluster_strength: 3.0
  fast_retransmit_w: 4.0
net:
  capacity_pps: 2000.0
  rtt_prop_s: 0.030
aqm:
  max_th_frac: 0.5
  w_q: 0.0001
sim:
  dt_s: 0.010
  device: auto
model:
  d_env: 4
  n_layers: 8
  d_cond: 8
  intensity_hidden: 64
  reset_max_probability: 1.0
  qubit_init_scale: 0.01
  qubit_controls: -1
data:
  horizons_train: [1, 5]
  c_min: 32
  c_cap_quantile: 0.9
train:
  lr: 0.003
  n_steps: 8000
  batch_configs: 1
  h0: 5
  lambda_obs: 0.25
  alpha_tail: 10.0
  lambda_wasserstein: 1.0
  wasserstein_queue_weight: 1.0
  wasserstein_window_weight: 1.0
  lambda_multitail: 0.10
  tail_threshold_fracs: [0.6, 0.7, 0.8, 0.9]
  lambda_reg: 1.0e-6
  fidelity_eps: 1.0e-12
  dist_weight_occupancy: 0.40
  dist_weight_uniform: 0.45
  dist_weight_tail: 0.15
  horizon_weight_power: 0.5
  vram_frac: 0.8
  seeds: [0, 1, 2, 3, 4]
